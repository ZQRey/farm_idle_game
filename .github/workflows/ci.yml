name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.0

jobs:
  validate:
    name: Validate GDScript and game state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Parse project
        run: godot --headless --path . --editor --quit-after 1

      - name: Run validation suite
        run: godot --headless --path . --script res://tools/test_validation.gd

  windows-build:
    name: Windows release export
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Build Windows x86_64
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/FarmIdleCompanion.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmIdleCompanion-Windows-x86_64
          path: build/windows/
          if-no-files-found: error
