name: Godot CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.0

jobs:
  validate:
    name: Validate GDScript and game state
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee godot-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" godot-import.log

      - name: Parse project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit-after 1 2>&1 | tee godot-parse.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" godot-parse.log

      - name: Run validation suite
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tools/test_validation.gd --quit-after 10 2>&1 | tee validation.log
          ! grep -E "SCRIPT ERROR:|Assertion failed|Parse Error:|Compile Error:|Failed to load script" validation.log
          grep -q "ВСЕ ТЕСТЫ УСПЕШНО ПРОЙДЕНЫ" validation.log

  windows-build:
    name: Windows release export
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee godot-export-import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script" godot-export-import.log

      - name: Build Windows x86_64
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/FarmIdleCompanion.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmIdleCompanion-Windows-x86_64
          path: build/windows/
          if-no-files-found: error


  windows-smoke:
    name: Windows executable smoke test
    runs-on: windows-latest
    needs: windows-build
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FarmIdleCompanion-Windows-x86_64
          path: app

      - name: Launch exported executable headless
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "app/FarmIdleCompanion.exe"
          if (-not (Test-Path $exe)) {
            throw "FarmIdleCompanion.exe not found"
          }

          $log = Join-Path $PWD "windows-smoke.log"
          & $exe --headless --quit-after 5 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            throw "Windows executable exited with code $LASTEXITCODE"
          }

          $content = Get-Content $log -Raw
          if ($content -match "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script") {
            throw "Godot runtime error detected in Windows smoke log"
          }

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmIdleCompanion-Windows-smoke-log
          path: windows-smoke.log
          if-no-files-found: ignore
